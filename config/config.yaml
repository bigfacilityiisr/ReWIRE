# ============================================================================
# ReWIRE — unified configuration
#
# Module I   (SNP calling)      -> flat keys, read directly by
#                                   Pipeline1_SNP_calling/rules/*.smk
# Module I   (post-processing)  -> nested "snp:"/"snpeff:" keys, read by
#                                   workflow/rules/snp_postprocessing.smk
# Module II  (miRNA discovery)  -> flat keys, read directly by
#                                   Pipeline2_miRNA_discovery/rules/*.smk
# Module III (integration)      -> nested "integration:" keys, read by
#                                   workflow/rules/integration.smk
#
# YAML anchors (&name / *name) are used so the sample lists / reference
# paths shared between the flat keys and the nested "snp:" section stay in
# sync automatically — edit the anchored value once, both consumers see it.
# ============================================================================

# ---------------- Module I: SNP calling (flat keys) -----------------------
reference: &reference "data/reference/genome.fna"
data_dir: &data_dir "data"

se_samples: &se_samples
  - SRR12340661

pe_samples: &pe_samples
  - SRR36323019
  - SRR12329118
  - SRR10739656
  - ERR4180116

samples_file: "metadata/samples.csv"

# ---------------- Module I post-processing (nested) ------------------------
snp:
  output_dir: "results/snp"
  se_samples: *se_samples
  pe_samples: *pe_samples
  reference: *reference
  annotation_gff: "data/reference/genome.gff"
  proteome_fasta: "data/reference/proteome.faa"
  gene_protein_map: "results/integration/gene_protein_map.txt"

snpeff:
  genome_name: "ginger"                 # name registered in your snpEff.config
  config_path: "~/snpeff/snpEff.config"

# ---------------- Module II: miRNA discovery (flat keys) -------------------
project_dir: &project_dir "results/mirna"

samples: &mirna_samples
  - SRR12080165
  - SRR12080166
  - SRR12080167
  - SRR12080168
  - SRR12080169
  - SRR12080170
  - SRR12080171
  - SRR12080172
  - SRR12080173
  - SRR12080174
  - SRR12080175
  - SRR12080176

adapter: "AGATCGGAAGAGC"

# Full multi-chromosome genome before cleaning/subsetting
raw_genome_fasta: "data/reference/genome.fna"
# Chromosome kept by rules/clean_genome.smk (edit/remove that rule's awk
# filter for a full-genome run instead of a single-chromosome test run)
target_chr_id: "NC_055986.1"
# Cleaned, single-header-per-record genome produced by clean_genome; used by
# miRDeep2 and the read-collapsing/mapping steps
genome_fasta: "data/reference/GCF_full_clean.fa"

rfam_fasta: "data/reference/rfam.fa"
mirbase: "data/reference/mirbase.fa"

# ---------------- Module III: integration (nested) --------------------------
integration:
  output_dir: "results/integration"
  transcriptome_fasta: "data/reference/transcriptome.fasta"

  # Candidate SNP-in-precursor locus for the WT vs MUT rewiring case study.
  # Picking the candidate is a manual step: after
  # results/integration/miRNA_precursor_SNPs.txt exists, inspect it and fill
  # these in for the precursor you want to study.
  candidate_locus:
    precursor_id: "NC_056004.1_21206"
    strand: "-"
    changes:                        # relative_position_in_precursor: alt_base
      38: "T"
      31: "A"
      27: "T"
      22: "T"
    mature_sequence: "GGCCGGCCATCGTCGTGA"
